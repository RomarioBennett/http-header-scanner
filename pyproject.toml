[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "http-header-scanner"
version = "1.0.0"
description = "Grade a website's HTTP security headers from A to F"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Romario Bennett" }]
keywords = ["security", "http", "headers", "csp", "hsts", "appsec"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Topic :: Security",
    "Environment :: Console",
]
dependencies = [
    "httpx>=0.27",
    "rich>=13.7",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.5"]

[project.scripts]
headerscan = "headerscan.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/headerscan"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "B", "UP", "SIM", "I"]
